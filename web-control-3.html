<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Form Elements Example</title>
  <style>
    body {
      background: #f4f6fb;
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 40px;
      color: #232323;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input[type="text"] {
      padding: 10px 14px;
      border: 1px solid #bfc5d2;
      border-radius: 5px;
      font-size: 1rem;
      width: 280px;
      box-sizing: border-box;
      transition: border-color .2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #4a90e2;
      background: #fafdff;
    }
    .custom-radio {
      margin-right: 16px;
    }
    input[type="radio"] {
      accent-color: #4285f4;
      margin-right: 4px;
      vertical-align: middle;
    }
    select {
      width: 180px;
      padding: 10px 14px;
      border: 1px solid #bfc5d2;
      border-radius: 5px;
      font-size: 1rem;
      background: #fff;
      transition: border-color .2s;
    }
    select:focus {
      outline: none;
      border-color: #4a90e2;
    }
    button {
      background: linear-gradient(90deg, #4a90e2 0%, #357ab7 100%);
      color: #fff;
      padding: 12px 32px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(74, 144, 226, 0.08);
      transition: background 0.2s;
    }
    button:hover {
      background: linear-gradient(90deg, #357ab7 0%, #4a90e2 100%);
    }
  </style>
</head>
<body>

  <h2>Styled Form Elements Example</h2>

  <form>
    <div class="form-group">
      <label for="username">Text Input</label>
      <input type="text" id="username" name="username" placeholder="Enter your name" />
    </div>

    <div class="form-group">
      <label>Choose a Gender:</label>
      <span class="custom-radio">
        <input type="radio" id="male" name="gender" value="male" checked>
        <label for="male">Male</label>
      </span>
      <span class="custom-radio">
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
      </span>
      <span class="custom-radio">
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
      </span>
    </div>

    <div class="form-group">
      <label for="country">Select a Country</label>
      <select id="country" name="country">
        <option value="">-- Please select --</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
        <option value="au">Australia</option>
      </select>
    </div>

    <button type="submit">Submit</button>
  </form>

</body>
</html>
